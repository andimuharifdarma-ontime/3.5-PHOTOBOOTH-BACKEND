name: Build SelftFoto Kiosk (Windows)

on:
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: photobooth-kiosk-app dekstop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write kiosk backend .env
        shell: pwsh
        env:
          DATABASE_URL: ${{ secrets.KIOSK_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.KIOSK_DIRECT_URL }}
          NEXTAUTH_SECRET: ${{ secrets.KIOSK_NEXTAUTH_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.KIOSK_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.KIOSK_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.KIOSK_SERVICE_ROLE_KEY }}
          ADMIN_URL: ${{ secrets.KIOSK_ADMIN_URL }}
          NEXT_PUBLIC_ADMIN_URL: ${{ secrets.KIOSK_ADMIN_URL }}
          DOKU_CLIENT_ID: ${{ secrets.KIOSK_DOKU_CLIENT_ID }}
          DOKU_SECRET_KEY: ${{ secrets.KIOSK_DOKU_SECRET_KEY }}
          DOKU_IS_PRODUCTION: ${{ secrets.KIOSK_DOKU_IS_PRODUCTION }}
          DOKU_PUBLIC_KEY: ${{ secrets.KIOSK_DOKU_PUBLIC_KEY }}
        run: |
          $envContent = @"
          DATABASE_URL="$env:DATABASE_URL"
          DIRECT_URL="$env:DIRECT_URL"
          NEXT_PUBLIC_SUPABASE_URL="$env:NEXT_PUBLIC_SUPABASE_URL"
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$env:NEXT_PUBLIC_SUPABASE_ANON_KEY"
          SUPABASE_SERVICE_ROLE_KEY="$env:SUPABASE_SERVICE_ROLE_KEY"
          NEXTAUTH_SECRET="$env:NEXTAUTH_SECRET"
          API_KEY_PEPPER="$env:NEXTAUTH_SECRET"
          NEXT_PUBLIC_ADMIN_URL="$env:NEXT_PUBLIC_ADMIN_URL"
          ADMIN_URL="$env:ADMIN_URL"
          KIOSK_FRONTEND_URL="http://localhost:3001"
          PORT=3000
          DOKU_CLIENT_ID=$env:DOKU_CLIENT_ID
          DOKU_SECRET_KEY=$env:DOKU_SECRET_KEY
          DOKU_IS_PRODUCTION=$env:DOKU_IS_PRODUCTION
          DOKU_PUBLIC_KEY="$env:DOKU_PUBLIC_KEY"
          "@
          Set-Content -Path "backend/.env" -Value $envContent -Encoding UTF8

      - name: Fix icon.ico (PNG renamed as ICO breaks electron-builder)
        shell: pwsh
        run: |
          pip install pillow
          python -c "from PIL import Image; img=Image.open('frontend/build/icon.png').convert('RGBA'); img.save('frontend/build/icon.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: npm install backend
        run: npm ci
        working-directory: photobooth-kiosk-app dekstop/backend

      - name: npm install frontend
        run: npm ci
        working-directory: photobooth-kiosk-app dekstop/frontend

      - name: Build Windows installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        working-directory: photobooth-kiosk-app dekstop/frontend
        run: npm run pack:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SelftFoto-Kiosk-Windows-Setup
          path: photobooth-kiosk-app dekstop/frontend/release/SelftFoto-Kiosk-Setup-*.exe
          if-no-files-found: error
